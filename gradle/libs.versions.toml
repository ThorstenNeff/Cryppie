[versions]
# KAN-123: AGP 9.1.0 (needs Gradle ≥9.3.1, see wrapper) + compileSdk 37 — prereq for reown/WalletConnect-Android.
agp = "9.1.0"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "36"
androidx-activity = "1.13.0"
androidx-appcompat = "1.7.1"
androidx-biometric = "1.1.0"
androidx-core = "1.19.0"
androidx-fragment = "1.8.6"
androidx-espresso = "3.7.0"
androidx-lifecycle = "2.11.0-beta01"
androidx-testExt = "1.3.0"
composeMultiplatform = "1.11.1"
junit = "4.13.2"
kotlin = "2.4.0"
kotlin-wrappers = "2026.6.1"
kotlinx-coroutines = "1.11.0"
ktor = "3.5.0"
logback = "1.5.34"
material3 = "1.11.0-alpha07"
koin = "4.2.0"
nav3 = "1.1.1"
composeAdaptive = "1.2.0"
robolectric = "4.14.1"
androidx-testCore = "1.6.1"
# Wallet crypto stack (ADR-0008). Versions re-verified against Maven Central 2026-06-18.
bitcoinKmp = "0.31.0"
secp256k1Kmp = "0.23.0"
kotlincryptoHash = "0.8.0"
cryptographyKotlin = "0.6.0"
kotlinxSerialization = "1.11.0"
# QR rendering for the Receive screen (KAN-78). Compose-MP, pinned vs Maven Central (2026-06-18).
qrose = "1.1.2"
# NFT media loading (KAN-105, PO-approved). Coil3 Compose-MP + Ktor3 network fetcher. Dep-verification = KAN-106.
coil = "3.4.0"
reownBom = "1.6.14" # WalletConnect v2 (Reown), Android-only (ADR-0015)

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
# Biometric unlock (ONB-9) — BiometricPrompt + CryptoObject (needs a FragmentActivity host).
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidx-biometric" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidx-fragment" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
# Compose UI testing (ADR-0011/0013) — runComposeUiTest + onNodeWithTag (multiplatform)
compose-uiTest = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
# JUnit4 Compose rule + StateRestorationTester (saved-instance restore) — ADR-0013 (input-bearing screens)
compose-uiTestJUnit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "composeMultiplatform" }
# Android host (JVM) Compose UI & config-change tests via Robolectric (ADR-0013)
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-testCore" }
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
ktor-serverCore = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktor-serverNetty = { module = "io.ktor:ktor-server-netty-jvm", version.ref = "ktor" }
ktor-serverTestHost = { module = "io.ktor:ktor-server-test-host-jvm", version.ref = "ktor" }
wrappers-browser = { module = "org.jetbrains.kotlin-wrappers:kotlin-browser", version.ref = "kotlin-wrappers" }

# Wallet crypto (ADR-0008) — BIP-39/BIP-32 (HD) + secp256k1 (EVM). No JS/Wasm → :wallet module only.
# bitcoin-kmp publishes no Android variant; Android/JVM consume the explicit -jvm jar, iOS the multiplatform (native) artifact.
bitcoin-kmp = { module = "fr.acinq.bitcoin:bitcoin-kmp", version.ref = "bitcoinKmp" }
bitcoin-kmp-jvm = { module = "fr.acinq.bitcoin:bitcoin-kmp-jvm", version.ref = "bitcoinKmp" }
# secp256k1 native binding: per-target JNI providers (the .so / .dylib loaders).
secp256k1-kmp-jni-jvm = { module = "fr.acinq.secp256k1:secp256k1-kmp-jni-jvm", version.ref = "secp256k1Kmp" }
secp256k1-kmp-jni-android = { module = "fr.acinq.secp256k1:secp256k1-kmp-jni-android", version.ref = "secp256k1Kmp" }
# keccak-256 for EVM addresses (ADR-0008 — cryptography-kotlin has SHA3 but not keccak).
kotlincrypto-hash-sha3 = { module = "org.kotlincrypto.hash:sha3", version.ref = "kotlincryptoHash" }
kotlincrypto-hash-sha3-jvm = { module = "org.kotlincrypto.hash:sha3-jvm", version.ref = "kotlincryptoHash" }
# cryptography-kotlin (ADR-0008/0009) — AES-GCM/PBKDF2/RNG/ed25519. core/provider wired by the storage layer.
cryptography-core = { module = "dev.whyoleg.cryptography:cryptography-core", version.ref = "cryptographyKotlin" }
cryptography-provider-optimal = { module = "dev.whyoleg.cryptography:cryptography-provider-optimal", version.ref = "cryptographyKotlin" }
# CSPRNG (CryptographyRandom) for BIP-39 entropy (KAN-72). -jvm jar for android+jvm, multiplatform (native) for iOS.
cryptography-random = { module = "dev.whyoleg.cryptography:cryptography-random", version.ref = "cryptographyKotlin" }
cryptography-random-jvm = { module = "dev.whyoleg.cryptography:cryptography-random-jvm", version.ref = "cryptographyKotlin" }

# RPC/Networking (ADR-0010) — Ktor client + kotlinx.serialization. Engines per target via expect/actual.
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# WalletConnect v2 — Reown WalletKit (ADR-0015), Android-only; BOM-managed. Project-id via build-config.
reown-android-bom = { module = "com.reown:android-bom", version.ref = "reownBom" }
reown-android-core = { module = "com.reown:android-core" }
reown-walletkit = { module = "com.reown:walletkit" }

# Dependency Injection — Koin (ADR-0007)
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }

# Navigation 3 (ADR-0006). navigation3-ui pulls navigation3-runtime transitively.
# lifecycle-viewmodel-navigation3 (per-entry VM scoping) + adaptive-navigation3 (multi-pane) are
# added with the screen tickets when actually needed.
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "nav3" }

# Adaptive layouts / Window Size Classes (ADR-0012) — currentWindowAdaptiveInfo()
compose-material3-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "composeAdaptive" }

# QR code rendering (KAN-78 Receive) — Compose-MP, commonMain, rememberQrCodePainter (vector, web-capable)
qrose = { module = "io.github.alexzhirkevich:qrose", version.ref = "qrose" }

# NFT media (KAN-105) — Coil3 AsyncImage (commonMain) + Ktor3 network fetcher. Non-web (:feature:wallet).
# Engines per target via Ktor (okhttp/cio/darwin) — not transitive from :rpc (implementation-scoped there).
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }